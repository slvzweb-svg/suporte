<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte Nobre RP | Recrutamento</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* === PALETA DE CORES === */
        :root {
            --bg-base: #050505;
            --bg-surface: #121212;
            --bg-surface-hover: #1a1a1a;
            --border-color: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #9e9e9e;
            --text-muted: #666666;
            --accent-red: #d32f2f;
            --accent-red-hover: #b71c1c;
            --accent-gold: #c5a059;
            --input-bg: #0a0a0a;
            --input-border: #333333;
            --input-focus: var(--accent-red);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.8);
            --shadow-red: 0 4px 20px rgba(211, 47, 47, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* === RESET E BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(211, 47, 47, 0.03), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(197, 160, 89, 0.02), transparent 25%);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* === HEADER === */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .brand i { color: var(--accent-red); font-size: 1.5rem; }

        .btn-header-login {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1.25rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-header-login:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
            background: var(--bg-surface);
        }

        /* === CONTAINER PRINCIPAL === */
        .wrapper {
            max-width: 800px;
            margin: 100px auto 60px;
            padding: 0 20px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeDown 0.6s ease-out;
        }

        .form-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* === CARDS DE SEÇÃO === */
        .section-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            animation: fadeUp 0.6s ease-out backwards;
        }

        .section-card:hover {
            border-color: #3a3a3a;
            box-shadow: var(--shadow-md);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title i { color: var(--accent-red); font-size: 1.2rem; }

        .section-title h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* === INPUTS === */
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        label span.required { color: var(--accent-red); margin-left: 4px; }

        input[type="text"], input[type="number"], input[type="email"], input[type="password"], select, textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-primary);
            padding: 14px 16px;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--input-focus);
            background-color: #000;
        }

        /* === GRID DE HORÁRIOS === */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 10px;
        }

        .checkbox-card {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            padding: 16px;
            border-radius: 6px;
        }

        .checkbox-card h4 {
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .check-item input[type="checkbox"] {
            appearance: none;
            width: 1.15em;
            height: 1.15em;
            border: 1px solid var(--text-muted);
            border-radius: 3px;
            display: grid;
            place-content: center;
            cursor: pointer;
        }

        .check-item input[type="checkbox"]:checked {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .check-item input[type="checkbox"]::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            background-color: #fff;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .check-item input[type="checkbox"]:checked::before { transform: scale(1); }

        /* === BOTÕES E TOAST === */
        .btn-submit {
            width: 100%;
            background-color: var(--accent-red);
            color: #fff;
            border: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-red);
        }

        .btn-submit:hover { background-color: var(--accent-red-hover); transform: translateY(-2px); }

        .toast-wrapper { position: fixed; bottom: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; }
        .toast {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 16px 20px;
            border-radius: 6px;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid #4caf50; }
        .toast.error { border-left: 4px solid var(--accent-red); }

        /* === MODALS === */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            padding: 24px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-login-action {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) { .checkbox-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-chess-knight"></i>
            <span>Nobre RP</span>
        </div>
        <button class="btn-header-login" onclick="toggleModal('modalLogin')">
            <i class="fa-solid fa-lock"></i> Staff
        </button>
    </header>

    <div class="wrapper">
        <div class="form-header">
            <h1>Formulário de Suporte</h1>
            <p>Buscamos pessoas pacientes e responsáveis. Responda com sinceridade.</p>
        </div>

        <form id="formRecrutamento">
            <div class="section-card" style="animation-delay: 0.1s;">
                <div class="section-title"><i class="fa-solid fa-id-badge"></i><h2>Dados Básicos</h2></div>
                <div class="form-group">
                    <label>Nome completo <span class="required">*</span></label>
                    <input type="text" id="nome" required placeholder="Digite seu nome">
                </div>
                <div class="form-group">
                    <label>Idade <span class="required">*</span></label>
                    <input type="number" id="idade" required min="14">
                </div>
                <div class="form-group">
                    <label>Cidade/Estado <span class="required">*</span></label>
                    <input type="text" id="cidade" required>
                </div>
                <div class="form-group">
                    <label>@ do Discord <span class="required">*</span></label>
                    <input type="text" id="discord" required>
                </div>
            </div>

            <div class="section-card" style="animation-delay: 0.2s;">
                <div class="section-title"><i class="fa-solid fa-user-shield"></i><h2>Perfil de Suporte</h2></div>
                <div class="form-group"><label>1. É paciente? Por quê?</label><textarea id="p1" required></textarea></div>
                <div class="form-group"><label>2. Como reage a xingamentos?</label><textarea id="p2" required></textarea></div>
                <div class="form-group"><label>3. Prefere resolver sozinho ou pedir ajuda?</label><textarea id="p3" required></textarea></div>
            </div>

            <div class="section-card" style="animation-delay: 0.3s;">
                <div class="section-title"><i class="fa-solid fa-bolt"></i><h2>Situações Práticas</h2></div>
                <div class="form-group"><label>4. Player reclamando da staff no ticket?</label><textarea id="p4" required></textarea></div>
                <div class="form-group"><label>5. Não sabe resolver o problema?</label><textarea id="p5" required></textarea></div>
                <div class="form-group"><label>6. Players discutindo no ticket?</label><textarea id="p6" required></textarea></div>
            </div>

            <div class="section-card" style="animation-delay: 0.4s;">
                <div class="section-title"><i class="fa-regular fa-clock"></i><h2>Compromisso</h2></div>
                <div class="form-group">
                    <label>7. Horários disponíveis (Selecione todos)</label>
                    <div class="checkbox-grid">
                        <div class="checkbox-card">
                            <h4>Turnos</h4>
                            <label class="check-item"><input type="checkbox" name="horario" value="Madrugada"><span>Madrugada</span></label>
                            <label class="check-item"><input type="checkbox" name="horario" value="Manhã"><span>Manhã</span></label>
                            <label class="check-item"><input type="checkbox" name="horario" value="Tarde"><span>Tarde</span></label>
                            <label class="check-item"><input type="checkbox" name="horario" value="Noite"><span>Noite</span></label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>8. Horas por dia?</label>
                    <input type="number" id="p8" required>
                </div>
                <div class="form-group">
                    <label>9. Consegue manter constância?</label>
                    <select id="p9" required>
                        <option value="Sim">Sim, todos os dias</option>
                        <option value="Maioria">Maioria dos dias</option>
                    </select>
                </div>
            </div>

            <div class="section-card" style="animation-delay: 0.5s;">
                <div class="section-title"><i class="fa-solid fa-display"></i><h2>Acesso</h2></div>
                <div class="form-group"><label>10. Dispositivos?</label><input type="text" id="p10" required></div>
                <div class="form-group"><label>11. Internet estável?</label><select id="p11"><option>Estável</option><option>Instável</option></select></div>
                <div class="form-group"><label>12. Conhece RP?</label><select id="p12"><option>Sim</option><option>Não</option></select></div>
                <div class="form-group"><label>13. Experiência anterior?</label><textarea id="p13"></textarea></div>
                <div class="form-group"><label>14. Conhecimento Discord?</label><select id="p14"><option>Baixo</option><option>Médio</option><option>Alto</option></select></div>
            </div>

            <div class="section-card" style="animation-delay: 0.6s;">
                <div class="section-title"><i class="fa-solid fa-bullseye"></i><h2>Intenção</h2></div>
                <div class="form-group"><label>15. Por que Nobre RP?</label><textarea id="p15" required></textarea></div>
                <div class="form-group"><label>16. O que é um bom suporte?</label><textarea id="p16" required></textarea></div>
                <div class="form-group"><label>17. Segue hierarquia?</label><select id="p17"><option>Sim</option><option>Não</option></select></div>
                <div class="form-group"><label>18. Como lida com críticas?</label><textarea id="p18" required></textarea></div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmitForm">
                <span>Enviar Inscrição</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 Nobre RP.</p>
    </footer>

    <div class="modal-overlay" id="modalLogin">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Acesso Restrito</h3>
                <button onclick="toggleModal('modalLogin')" style="background:none; border:none; color:#fff; cursor:pointer;">X</button>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="admin@nobrerp.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button class="btn-login-action" onclick="executarLogin()">Conectar</button>
        </div>
    </div>

    <div class="toast-wrapper" id="toastBox"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwVQFewEN1mQDe0pnIEVU_H98l5JCeciI",
            authDomain: "site-f55e1.firebaseapp.com",
            projectId: "site-f55e1",
            storageBucket: "site-f55e1.firebasestorage.app",
            messagingSenderId: "800441189890",
            appId: "1:800441189890:web:27f8911aa47964665f091b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Funções Globais
        window.emitirToast = function(mensagem, tipo = 'success') {
            const caixa = document.getElementById('toastBox');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerHTML = `<span>${mensagem}</span>`;
            caixa.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 4000);
        }

        window.toggleModal = function(id) {
            document.getElementById(id).classList.toggle('active');
        }

        // Login Staff
        window.executarLogin = function() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;

            if(!email || !pass) {
                emitirToast("Preencha os campos.", "error");
                return;
            }

            signInWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    emitirToast("Sucesso! Redirecionando...", "success");
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                })
                .catch(() => {
                    emitirToast("E-mail ou senha incorretos.", "error");
                });
        }

        // Formulário Recrutamento
        document.getElementById('formRecrutamento').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitForm');
            btn.disabled = true;

            const checks = document.querySelectorAll('input[name="horario"]:checked');
            const horarios = Array.from(checks).map(c => c.value);

            const dados = {
                status: "Aguardando",
                data: serverTimestamp(),
                nome: document.getElementById('nome').value,
                discord: document.getElementById('discord').value,
                horarios: horarios
                // Adicione os outros campos se desejar salvar tudo no banco
            };

            try {
                await addDoc(collection(db, "candidatos_suporte"), dados);
                emitirToast("Inscrição enviada!", "success");
                this.reset();
            } catch (error) {
                emitirToast("Erro ao enviar.", "error");
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
